<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#0f1a2b">
  <meta name="description" content="Safetop Arcade: cuatro minijuegos para proteger a tu equipo con los EPI de Safetop.">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <title>Safetop Arcade</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0f1a2b;
      overflow: hidden;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      font-family: Arial, Helvetica, sans-serif;
    }
    #game {
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    canvas { display: block; }
  </style>
</head>
<body>
  <div id="game"></div>

  <!-- Motor -->
  <script src="lib/phaser.min.js"></script>

  <!-- Datos del juego (productos Safetop, tareas...) -->
  <script src="src/data/products.js"></script>

  <!-- Utilidades compartidas (gráficos, sonido, guardado) -->
  <script src="src/utils.js"></script>

  <!-- Escenas -->
  <script src="src/scenes/BootScene.js"></script>
  <script src="src/scenes/MenuScene.js"></script>
  <script src="src/scenes/AlmacenScene.js"></script>
  <script src="src/scenes/ZonaSeguraScene.js"></script>
  <script src="src/scenes/AlturaScene.js"></script>
  <script src="src/scenes/InspectorScene.js"></script>
  <script src="src/scenes/RunnerScene.js"></script>
  <script src="src/scenes/GameOverScene.js"></script>

  <!-- Arranque -->
  <script src="src/main.js"></script>
</body>
</html>
